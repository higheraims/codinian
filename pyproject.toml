[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codinian"
dynamic = ["version"]
description = "GUI tool for managing repositories, issues and Claude Code sessions"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "higheraims", email = "122185704+higheraims@users.noreply.github.com"}]
requires-python = ">=3.12"
# aiohttp carries the remote server, so it faces whatever reaches the bind
# address. Floored at 3.12.14, the release that fixed the last request-smuggling
# hole in the pure-Python HTTP parser (CVE-2025-53643), rather than left
# unbounded to resolve to whatever is already installed (ISSUE-041).
dependencies = ["aiohttp>=3.12.14", "claude-agent-sdk", "qrcode"]

[project.optional-dependencies]
# The suite itself needs nothing but pytest; every other import it makes is
# already a runtime dependency.
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/higheraims/codinian"
Issues = "https://github.com/higheraims/codinian/issues"

# Read from version.py, so the sidebar's "Codinian" and version number agree
# with the package and there is one place to bump (ISSUE-030).
[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.setuptools.package-data]
"remote.static" = ["*.html", "*.css", "*.js"]

# Tests live in tests/ and import the app's modules by their bare names
# (`import issues`), which is how the app imports them too. The repo uses a flat
# layout, so the root has to be on sys.path for that to work; `pythonpath` does
# it without a conftest.py at the top level.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
